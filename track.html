<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lacak Servis - Toko Seiko Alba</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
  h2 { text-align: center; color: #0f172a; margin-top: 0; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
  button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  #hasil { display: none; margin-top: 20px; border-top: 1px dashed #cbd5e1; padding-top: 20px; }
  .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .label { color: #64748b; }
  .value { font-weight: bold; color: #0f172a; text-align: right; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .antri { background: #fef3c7; color: #92400e; }
  .proses { background: #dbeafe; color: #1e40af; }
  .selesai { background: #dcfce7; color: #166534; }
  .diambil { background: #e5e7eb; color: #374151; }
  .total-box { background: #f8fafc; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #0284c7; }
  .error-box { color: #dc2626; font-size: 12px; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="card">
  <h2>⌚ Lacak Servis</h2>
  <p style="text-align:center; font-size:13px; color:#64748b; margin-bottom:15px;">Masukkan Nomor Servis Anda</p>
  
  <input type="text" id="inputSrv" placeholder="Ketik Nomor Servis (Contoh: SRV123)">
  <button id="btnLacak">Cari Status</button>
  <div id="errorBox" class="error-box"></div>
  
  <div id="hasil">
    <h3 style="text-align:center; margin-bottom:15px; color:#0284c7;">Status Servis Anda</h3>
    <div class="row"><span class="label">No. Servis</span><span class="value" id="resId">-</span></div>
    <div class="row"><span class="label">Nama</span><span class="value" id="resNama">-</span></div>
    <div class="row"><span class="label">Barang</span><span class="value" id="resProduk">-</span></div>
    <div class="row"><span class="label">Keluhan</span><span class="value" id="resKeluhan">-</span></div>
    <div class="row"><span class="label">Status</span><span class="value"><span id="resStatus" class="badge">-</span></span></div>
    
    <!-- RINCIAN BIAYA -->
    <div class="total-box">
      <div class="row"><span class="label">Jasa Servis</span><span class="value" id="resJasa">Rp 0</span></div>
      <div class="row"><span class="label">Spare Part</span><span class="value" id="resParts">Rp 0</span></div>
      <div class="row"><span class="label">Baterai</span><span class="value" id="resBaterai">Rp 0</span></div>
      <hr style="border:none;border-top:1px dashed #cbd5e1;margin:8px 0">
      <div class="row"><span class="label" style="font-weight:bold;color:#0f172a;">TOTAL BIAYA</span><span class="value" id="resTotal" style="color:#0284c7; font-size:16px;">Rp 0</span></div>
      <div class="row"><span class="label" style="color:#dc2626;">Sisa Tagihan</span><span class="value" id="resSisa" style="color:#dc2626;">Rp 0</span></div>
    </div>

    <div class="row" id="rowGaransi" style="display:none; margin-top:10px; border-top:1px dashed #cbd5e1; padding-top:10px;">
      <span class="label">Garansi S/d</span><span class="value" id="resGaransi">-</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  if (!window.supabase) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').innerText = 'Gagal memuat library Supabase.';
  } else {
    const SUPABASE_URL = 'https://khgooqasgscsxgegdqzc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2adK53mvsJXzoDerImtgNQ_zpfe-6Hd';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function prosesLacak() {
      const keyword = document.getElementById('inputSrv').value.trim();
      const urlParams = new URLSearchParams(window.location.search);
      const groupIdDariUrl = urlParams.get('group_id');
      const idDariUrl = urlParams.get('id');

      if (!keyword && !groupIdDariUrl && !idDariUrl) return alert('Masukkan nomor servis terlebih dahulu!');

      const btn = document.getElementById('btnLacak');
      btn.innerText = 'Mencari...';
      btn.disabled = true;
      document.getElementById('errorBox').style.display = 'none';

      try {
        // GUNAKAN RPC AGAR AMAN (Hanya mengambil data yang diminta)
        const { data, error } = await supabaseClient.rpc('lacak_servis', { 
            p_id: (keyword || idDariUrl) ? (keyword || idDariUrl) : null, 
            p_group_id: (groupIdDariUrl && !keyword) ? groupIdDariUrl : null 
        });
        
        if (error) throw new Error(error.message);
        
        if (data && data.length > 0) {
          const customer = data[0].customer;
          document.getElementById('resNamaUtama').innerHTML = `Pelanggan: <b>${customer}</b> <br><span style="font-size:12px;color:#94a3b8">Total: ${data.length} Barang</span>`;
          
          let htmlList = '';
          let grandTotal = 0;
          let grandSisa = 0;

          data.forEach((s, index) => {
            grandTotal += (s.biaya_pelanggan || 0);
            grandSisa += (s.sisa || 0);

            let warnaBorder = '#fbbf24'; 
            if (s.status === 'proses') warnaBorder = '#3b82f6';
            if (s.status === 'selesai') warnaBorder = '#16a34a';
            if (s.status === 'diambil') warnaBorder = '#94a3b8';

            let statusBayar = s.paid ? `<span style="color:#16a34a;font-weight:bold;font-size:12px;">LUNAS</span>` : `<span style="color:#f87171;font-weight:bold;font-size:12px;">Sisa: Rp ${(s.sisa||0).toLocaleString('id-ID')}</span>`;

            htmlList += `
              <div class="item-servis" style="border-left-color: ${warnaBorder}">
                <div class="header-item">
                  <span class="judul">${index + 1}. ${s.produk}</span>
                  <span class="badge ${s.status}">${s.status}</span>
                </div>
                <div class="detail">No: <b>${s.id}</b> | Keluhan: ${s.keluhan || '-'}</div>
                ${s.kondisi_fisik && s.kondisi_fisik !== '-' ? `<div class="detail" style="color:#f87171;">⚠️ Kondisi: ${s.kondisi_fisik}</div>` : ''}
                <div class="row" style="margin-top:5px; margin-bottom:0; border-top:1px dashed #334155; padding-top:5px;">
                  <span class="label">Biaya: Rp ${(s.biaya_pelanggan||0).toLocaleString('id-ID')}</span>
                  ${statusBayar}
                </div>
              </div>
            `;
          });

          document.getElementById('listBarangContainer').innerHTML = htmlList;
          document.getElementById('resTotal').textContent = 'Rp ' + grandTotal.toLocaleString('id-ID');
          
          const elSisa = document.getElementById('resSisa');
          if (grandSisa > 0) {
            elSisa.textContent = 'Rp ' + grandSisa.toLocaleString('id-ID');
            elSisa.style.color = '#f87171';
          } else {
            elSisa.textContent = 'LUNAS';
            elSisa.style.color = '#16a34a';
          }

          document.getElementById('hasil').style.display = 'block';
        } else {
          alert('Data Servis tidak ditemukan. Pastikan penulisan sudah benar.');
          document.getElementById('hasil').style.display = 'none';
        }
      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      } finally {
        btn.innerText = 'Cari Status';
        btn.disabled = false;
      }
    }

    document.getElementById('btnLacak').addEventListener('click', prosesLacak);
    document.getElementById('inputSrv').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') prosesLacak();
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('group_id') || urlParams.get('id')) {
      prosesLacak(); 
    }
  }
</script>
</body>
</html>
