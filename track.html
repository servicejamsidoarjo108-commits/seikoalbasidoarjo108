<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lacak Servis - Toko Seiko Alba</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
  .lang-bar { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 10px; }
  .lang-btn { width: auto; padding: 4px 10px; font-size: 12px; font-weight: 600; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
  .lang-btn.active { background: #0284c7; color: #fff; border-color: #0284c7; }
  h2 { text-align: center; color: #0f172a; margin-top: 0; }
  .sub { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
  #btnLacak { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  #btnLacak:disabled { opacity: .6; cursor: default; }
  #hasil { display: none; margin-top: 20px; border-top: 1px dashed #cbd5e1; padding-top: 20px; }
  .row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 14px; }
  .label { color: #64748b; }
  .value { font-weight: bold; color: #0f172a; text-align: right; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #e5e7eb; color: #374151; white-space: nowrap; }
  .badge.antri { background: #fef3c7; color: #92400e; }
  .badge.proses { background: #dbeafe; color: #1e40af; }
  .badge.selesai { background: #dcfce7; color: #166534; }
  .badge.diambil { background: #e5e7eb; color: #374151; }
  .item { border: 1px solid #e2e8f0; border-left: 4px solid #fbbf24; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .item .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .item .judul { font-weight: bold; color: #0f172a; font-size: 14px; }
  .item .detail { font-size: 12px; color: #475569; margin-bottom: 3px; }
  .item .warn { color: #dc2626; }
  .total-box { background: #f8fafc; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #0284c7; }
  .error-box { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
  .lunas { color: #16a34a; font-weight: bold; }
  .sisa { color: #dc2626; font-weight: bold; }
</style>
</head>
<body>

<div class="card">
  <div class="lang-bar">
    <button type="button" class="lang-btn" data-lang="id">ID</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="zh">中文</button>
  </div>

  <h2 id="txtTitle">⌚ Lacak Servis</h2>
  <p class="sub" id="txtSub">Masukkan Nomor Servis Anda</p>

  <input type="text" id="inputSrv" placeholder="Contoh: SRV1731234567890abcd" autocomplete="off" autocapitalize="off">
  <button id="btnLacak">Cari Status</button>
  <div id="errorBox" class="error-box" role="alert"></div>

  <div id="hasil">
    <h3 id="txtHasilTitle" style="text-align:center; margin:0 0 5px; color:#0284c7;">Status Servis Anda</h3>
    <div id="ringkasan" style="text-align:center; font-size:13px; color:#475569; margin-bottom:12px;"></div>
    <div id="listBarang"></div>
    <div class="total-box">
      <div class="row"><span class="label" id="txtTotalLbl" style="font-weight:bold;color:#0f172a;">TOTAL BIAYA</span><span class="value" id="resTotal" style="color:#0284c7;font-size:16px;">Rp 0</span></div>
      <div class="row"><span class="label" id="txtSisaLbl">Sisa Tagihan</span><span class="value" id="resSisa">Rp 0</span></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CURRENCY_MAP = {
  IDR: { sym: 'Rp ', locale: 'id-ID', dec: 0 },
  USD: { sym: '$',   locale: 'en-US', dec: 2 },
  CNY: { sym: '¥',   locale: 'zh-CN', dec: 2 },
  SGD: { sym: 'S$',  locale: 'en-SG', dec: 2 },
  MYR: { sym: 'RM ', locale: 'ms-MY', dec: 2 }
};

function rp(n) {
  const urlCurr = new URLSearchParams(location.search).get('curr');
  const code = (urlCurr && CURRENCY_MAP[urlCurr.toUpperCase()])
    ? urlCurr.toUpperCase()
    : (localStorage.getItem('horopos_curr') || 'IDR');
  const cfg = CURRENCY_MAP[code] || CURRENCY_MAP.IDR;
  return cfg.sym + (Number(n) || 0).toLocaleString(cfg.locale, {
    minimumFractionDigits: 0,
    maximumFractionDigits: cfg.dec
  });
}

  const DICT = {
    id: {
      pageTitle: 'Lacak Servis - Toko Seiko Alba',
      title: '⌚ Lacak Servis',
      sub: 'Masukkan Nomor Servis Anda',
      placeholder: 'Contoh: SRV1731234567890abcd',
      btnCari: 'Cari Status',
      btnMencari: 'Mencari...',
      hasilTitle: 'Status Servis Anda',
      totalBiaya: 'TOTAL BIAYA',
      sisaTagihan: 'Sisa Tagihan',
      pelanggan: 'Pelanggan',
      barang: 'barang',
      no: 'No',
      keluhan: 'Keluhan',
      kondisiAwal: 'Kondisi awal',
      jasa: 'Jasa Servis',
      part: 'Spare Part',
      baterai: 'Baterai',
      biaya: 'Biaya',
      dp: 'DP (sudah dibayar)',
      pembayaran: 'Pembayaran',
      lunas: 'LUNAS',
      sisa: 'Sisa ',
      garansi: 'Garansi s/d',
      pukul: 'pukul 23:59',
      locale: 'id-ID',
      errLib: 'Gagal memuat library Supabase. Periksa koneksi internet lalu muat ulang halaman.',
      errKosong: 'Masukkan nomor servis terlebih dahulu.',
      errNotFound: 'Data servis tidak ditemukan. Pastikan nomor sudah benar.',
      errGen: 'Terjadi kesalahan: ',
      status: {
        antri:   { label: 'Antri',                  warna: '#fbbf24' },
        proses:  { label: 'Sedang Dikerjakan',      warna: '#3b82f6' },
        selesai: { label: 'Selesai - Siap Diambil', warna: '#16a34a' },
        diambil: { label: 'Sudah Diambil',          warna: '#94a3b8' }
      }
    },
    en: {
      pageTitle: 'Track Service - Toko Seiko Alba',
      title: '⌚ Track Service',
      sub: 'Enter Your Service Number',
      placeholder: 'Example: SRV1731234567890abcd',
      btnCari: 'Check Status',
      btnMencari: 'Searching...',
      hasilTitle: 'Your Service Status',
      totalBiaya: 'TOTAL COST',
      sisaTagihan: 'Balance Due',
      pelanggan: 'Customer',
      barang: 'items',
      no: 'No',
      keluhan: 'Issue',
      kondisiAwal: 'Initial condition',
      jasa: 'Service Fee',
      part: 'Spare Parts',
      baterai: 'Battery',
      biaya: 'Cost',
      dp: 'Deposit (paid)',
      pembayaran: 'Payment',
      lunas: 'PAID',
      sisa: 'Balance ',
      garansi: 'Warranty until',
      pukul: 'at 23:59',
      locale: 'en-US',
      errLib: 'Failed to load Supabase library. Please check your internet connection and reload.',
      errKosong: 'Please enter your service number first.',
      errNotFound: 'Service record not found. Please check the number.',
      errGen: 'An error occurred: ',
      status: {
        antri:   { label: 'Queued',                 warna: '#fbbf24' },
        proses:  { label: 'In Progress',            warna: '#3b82f6' },
        selesai: { label: 'Ready for Pickup',       warna: '#16a34a' },
        diambil: { label: 'Picked Up',              warna: '#94a3b8' }
      }
    },
    zh: {
      pageTitle: '维修进度查询 - Toko Seiko Alba',
      title: '⌚ 维修进度查询',
      sub: '请输入您的维修单号',
      placeholder: '示例：SRV1731234567890abcd',
      btnCari: '查询状态',
      btnMencari: '查询中...',
      hasilTitle: '您的维修状态',
      totalBiaya: '总费用',
      sisaTagihan: '应付余额',
      pelanggan: '客户',
      barang: '件商品',
      no: '单号',
      keluhan: '故障',
      kondisiAwal: '初始外观',
      jasa: '维修工费',
      part: '配件费',
      baterai: '电池费',
      biaya: '费用',
      dp: '定金（已付）',
      pembayaran: '付款状态',
      lunas: '已结清',
      sisa: '余额 ',
      garansi: '保修至',
      pukul: '23:59',
      locale: 'zh-CN',
      errLib: '无法加载数据组件，请检查网络后刷新页面。',
      errKosong: '请先输入维修单号。',
      errNotFound: '未找到维修记录，请确认单号是否正确。',
      errGen: '发生错误：',
      status: {
        antri:   { label: '排队中',       warna: '#fbbf24' },
        proses:  { label: '维修中',       warna: '#3b82f6' },
        selesai: { label: '已完成·可取件', warna: '#16a34a' },
        diambil: { label: '已取件',       warna: '#94a3b8' }
      }
    }
  };

  const urlParams = new URLSearchParams(window.location.search);
  let lang = urlParams.get('lang') || localStorage.getItem('ta_lang') || localStorage.getItem('horopos_lang') || 'id';
  if (!DICT[lang]) lang = 'id';
  let lastData = null;

  function T() { return DICT[lang]; }

  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.title = t.pageTitle;
    $('txtTitle').textContent = t.title;
    $('txtSub').textContent = t.sub;
    $('inputSrv').placeholder = t.placeholder;
    if (!$('btnLacak').disabled) $('btnLacak').textContent = t.btnCari;
    $('txtHasilTitle').textContent = t.hasilTitle;
    $('txtTotalLbl').textContent = t.totalBiaya;
    $('txtSisaLbl').textContent = t.sisaTagihan;
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    if (lastData) renderHasil(lastData);
  }

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => {
      lang = b.dataset.lang;
      try { localStorage.setItem('ta_lang', lang); } catch (e) {}
      applyLang();
    });
  });

  function tampilError(pesan) {
    const el = $('errorBox');
    el.textContent = pesan;
    el.style.display = pesan ? 'block' : 'none';
  }

  applyLang();

  if (!window.supabase) { tampilError(T().errLib); return; }

  const supabaseClient = window.supabase.createClient(
    'https://khgooqasgscsxgegdqzc.supabase.co',
    'sb_publishable_2adK53mvsJXzoDerImtgNQ_zpfe-6Hd'
  );

  function barisItem(item, index) {
    const t = T();
    const st = t.status[item.status] || { label: item.status || '-', warna: '#fbbf24' };
    const kelasBadge = t.status[item.status] ? item.status : '';
    const lunas = item.paid || (item.sisa || 0) <= 0;
    const garansi = item.tgl_garansi_servis_sampai
      ? new Date(item.tgl_garansi_servis_sampai + 'T00:00:00').toLocaleDateString(t.locale, { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + t.pukul
      : '';
    const rincian = [
      [t.jasa, item.jasa], [t.part, item.total_parts], [t.baterai, item.total_baterai]
    ].filter(r => (r[1] || 0) > 0).map(r => `<div class="row"><span class="label">${r[0]}</span><span class="value">${rp(r[1])}</span></div>`).join('');
    const barisDp = (item.dp || 0) > 0 ? `<div class="row"><span class="label">${t.dp}</span><span class="value">${rp(item.dp)}</span></div>` : '';

    return `<div class="item" style="border-left-color:${st.warna}">
      <div class="head"><span class="judul">${index + 1}. ${esc(item.produk)}</span><span class="badge ${kelasBadge}">${esc(st.label)}</span></div>
      <div class="detail">${t.no}: <b>${esc(item.id)}</b></div>
      <div class="detail">${t.keluhan}: ${esc(item.keluhan || '-')}</div>
      ${item.kondisi_fisik && item.kondisi_fisik !== '-' ? `<div class="detail warn">⚠️ ${t.kondisiAwal}: ${esc(item.kondisi_fisik)}</div>` : ''}
      <div style="margin-top:6px;border-top:1px dashed #cbd5e1;padding-top:6px;">
        ${rincian}
        <div class="row"><span class="label">${t.biaya}</span><span class="value">${rp(item.biaya_pelanggan)}</span></div>
        ${barisDp}
        <div class="row"><span class="label">${t.pembayaran}</span><span class="${lunas ? 'lunas' : 'sisa'}">${lunas ? t.lunas : t.sisa + rp(item.sisa)}</span></div>
        ${garansi ? `<div class="row"><span class="label">${t.garansi}</span><span class="value">${esc(garansi)}</span></div>` : ''}
      </div>
    </div>`;
  }

  function renderHasil(data) {
    const t = T();
    const totalBiaya = data.reduce((s, x) => s + (Number(x.biaya_pelanggan) || 0), 0);
    const totalSisa = data.reduce((s, x) => s + (Number(x.sisa) || 0), 0);

    $('ringkasan').innerHTML = `${t.pelanggan}: <b>${esc(data[0].customer)}</b>` + (data.length > 1 ? `<br><span style="font-size:12px;color:#94a3b8">${data.length} ${t.barang}</span>` : '');
    $('listBarang').innerHTML = data.map(barisItem).join('');
    $('resTotal').textContent = rp(totalBiaya);
    const elSisa = $('resSisa');
    elSisa.textContent = totalSisa > 0 ? rp(totalSisa) : t.lunas;
    elSisa.className = 'value ' + (totalSisa > 0 ? 'sisa' : 'lunas');
    $('hasil').style.display = 'block';
  }

  async function prosesLacak() {
    const params = new URLSearchParams(window.location.search);
    const keyword = $('inputSrv').value.trim();
    const idUrl = params.get('id'), groupUrl = params.get('group_id');

    let pId = null, pGroup = null;
    if (keyword) {
      if (/^grp/i.test(keyword)) pGroup = keyword; else pId = keyword;
    } else {
      pId = idUrl; pGroup = groupUrl;
    }
    if (!pId && !pGroup) { tampilError(T().errKosong); return; }

    const btn = $('btnLacak');
    btn.textContent = T().btnMencari; btn.disabled = true;
    tampilError('');
    $('hasil').style.display = 'none';

    try {
      const { data, error } = await supabaseClient.rpc('lacak_servis', { p_id: pId, p_group_id: pGroup });
      if (error) throw new Error(error.message);
      if (!data || !data.length) { lastData = null; tampilError(T().errNotFound); return; }

      lastData = data;
      renderHasil(data);
    } catch (err) {
      tampilError(T().errGen + err.message);
    } finally {
      btn.textContent = T().btnCari; btn.disabled = false;
    }
  }

  $('btnLacak').addEventListener('click', prosesLacak);
  $('inputSrv').addEventListener('keypress', e => { if (e.key === 'Enter') prosesLacak(); });

  if (urlParams.get('id') || urlParams.get('group_id')) prosesLacak();
})();
</script>
</body>
</html>
