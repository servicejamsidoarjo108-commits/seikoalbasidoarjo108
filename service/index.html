<script>
  // Tempel Endpoint URL submit-booking dari Supabase di sini
  const ENDPOINT_BOOKING = 'https://khgooqasgscsxgegdqzc.supabase.co/functions/v1/submit-booking';

  let sedangKirim = false;

  function tampilkanInfoMetode() {
    const metode = document.getElementById('metode').value;
    const infoBox = document.getElementById('infoMetode');

    if (metode === 'Kirim Paket Ekspedisi') {
      infoBox.textContent = 'Tips pengiriman luar kota: gunakan bubble wrap tebal & kotak keras. Paket akan direkam video unboxing saat tiba di toko.';
      infoBox.style.display = 'block';
    } else if (metode === 'Layanan Antar-Jemput / Kurir Instan') {
      infoBox.textContent = 'Admin akan menginformasikan jadwal penjemputan atau estimasi kurir instan sesuai area domisili Anda.';
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
      infoBox.textContent = '';
    }
  }

  async function kirimKeWhatsApp(event) {
    event.preventDefault();
    if (sedangKirim) return;

    const website = document.getElementById('website').value.trim();
    if (website !== '') return;

    const nomorWhatsAppAdmin = ['62', '813', '3193', '9397'].join('');

    const payload = {
      nama: document.getElementById('nama').value.trim(),
      no_hp: document.getElementById('no_hp').value.trim(),
      domisili: document.getElementById('domisili').value.trim(),
      metode: document.getElementById('metode').value.trim(),
      merek: document.getElementById('merek').value.trim(),
      jenis_service: document.getElementById('jenis_service').value.trim(),
      keluhan: document.getElementById('keluhan').value.trim(),
      website
    };

    if (!payload.nama || !payload.no_hp || !payload.domisili || !payload.metode || !payload.merek || !payload.jenis_service || !payload.keluhan) {
      alert('Harap lengkapi semua kolom terlebih dahulu.');
      return;
    }

    const digitHp = payload.no_hp.replace(/\D/g, '');
    if (digitHp.length < 9 || digitHp.length > 15) {
      alert('Nomor WhatsApp tidak valid. Masukkan 9–15 digit angka.');
      return;
    }

    const btn = document.getElementById('btnKirim');
    sedangKirim = true;
    btn.disabled = true;
    btn.textContent = 'Menyimpan booking...';

    let kodeBooking = '';

    // Kirim ke Supabase dengan batas waktu 5 detik (fallback aman jika sinyal lambat)
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const res = await fetch(ENDPOINT_BOOKING, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.ok) {
        const data = await res.json();
        if (data.kode_booking) kodeBooking = data.kode_booking;
      }
    } catch (err) {
      console.warn('Fallback ke WhatsApp langsung:', err);
    }

    const barisKode = kodeBooking ? `🎫 *Kode Booking:* ${kodeBooking}\n` : '';
    const pesanMentah =
      `Halo Admin, saya ingin mengajukan *Service Arloji* dengan detail berikut:\n\n` +
      barisKode +
      `👤 *Nama:* ${payload.nama}\n` +
      `📞 *No. HP:* ${payload.no_hp}\n` +
      `📍 *Domisili:* ${payload.domisili}\n` +
      `📦 *Metode:* ${payload.metode}\n` +
      `⌚ *Merek/Tipe:* ${payload.merek}\n` +
      `🛠️ *Jenis Layanan:* ${payload.jenis_service}\n` +
      `📝 *Keluhan:* ${payload.keluhan}\n\n` +
      `Mohon info estimasi biaya dan mekanismenya. Terima kasih!`;

    const url = `https://wa.me/${nomorWhatsAppAdmin}?text=${encodeURIComponent(pesanMentah)}`;

    btn.textContent = 'Membuka WhatsApp...';
    setTimeout(() => {
      sedangKirim = false;
      btn.disabled = false;
      btn.textContent = 'Kirim via WhatsApp';
    }, 3000);

    // Gunakan location.href agar tidak diblokir popup blocker HP setelah proses async
    window.location.href = url;
  }
</script>
